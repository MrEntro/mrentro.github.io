# VPS deployment: the site container serves plain HTTP on localhost:8080.
# TLS terminates in front of it (Caddy below, to be enabled on the VPS).
services:
  site:
    build: .
    image: mrentro-site
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    ports:
      - "127.0.0.1:8080:8080"

