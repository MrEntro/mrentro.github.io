server {
    listen 8080;
    listen [::]:8080;
    server_name _;
    root /usr/share/nginx/html;

    server_tokens off;
    absolute_redirect off;
    charset utf-8;

    error_page 404 /404.html;

    # Quartz links pages without the .html extension
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri.html $uri/index.html =404;
    }

    # asset names are not content-hashed, so cache briefly
    location ~* \.(css|js|json|png|jpe?g|gif|webp|avif|svg|ico|woff2?)$ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=3600" always;
        try_files $uri =404;
    }

    location = /404.html {
        include /etc/nginx/snippets/security-headers.conf;
        internal;
    }
}
