name: Deploy

# One build, many hosts (M16 Part D, docs/HOSTING.md). GitHub Pages is primary and on unless the
# repository variable DEPLOY_PAGES is "false"; every other host is off until its variable is
# "true" and its secrets exist. Each deploy ends with a smoke test against that host.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # git history feeds page dates
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx tsx --test deploy/targets.test.mjs
      - run: npx quartz build
        env:
          QUARTZ_ENV: production
          SITE_URL: ${{ vars.SITE_URL }}
      - name: Host files (build stamp, Cloudflare _headers, Apache .htaccess)
        run: node deploy/targets.mjs public out "$GITHUB_SHA"
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: github.event_name != 'pull_request'
        with:
          path: public
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.event_name != 'pull_request' && (vars.DEPLOY_CLOUDFLARE == 'true' || vars.DEPLOY_SFTP == 'true')
        with:
          name: hosts
          path: out
          include-hidden-files: true # .htaccess
          retention-days: 7

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.DEPLOY_PAGES != 'false'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: deploy
      - name: Smoke test
        run: deploy/smoke-remote.sh "${PAGE_URL%/}" "$GITHUB_SHA" --no-headers
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}

  cloudflare:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.DEPLOY_CLOUDFLARE == 'true'
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: cloudflare-pages
      url: ${{ vars.CLOUDFLARE_URL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: deploy
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: hosts
          path: out
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Deploy (wrangler, pinned)
        run: npx --yes wrangler@4.151.3 pages deploy out/cloudflare --project-name "$PROJECT" --branch main --commit-hash "$GITHUB_SHA"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PROJECT: ${{ vars.CLOUDFLARE_PROJECT || 'mrentro' }}
      - name: Smoke test
        run: deploy/smoke-remote.sh "${URL%/}" "$GITHUB_SHA"
        env:
          URL: ${{ vars.CLOUDFLARE_URL }}

  vps-image:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.DEPLOY_VPS == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.push.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Build, smoke-test and push the image
        id: push
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/mrentro-site:$GITHUB_SHA"
          docker build --build-arg SITE_URL="$SITE_URL" --build-arg BUILD_SHA="$GITHUB_SHA" -t "$image" .
          docker run -d --name site -p 127.0.0.1:8080:8080 --read-only --tmpfs /tmp \
            --cap-drop ALL --security-opt no-new-privileges:true "$image"
          for _ in $(seq 1 20); do curl -fs -o /dev/null http://127.0.0.1:8080/ && break; sleep 1; done
          deploy/smoke-test.sh http://127.0.0.1:8080
          echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker push "$image"
          echo "image=$image" >> "$GITHUB_OUTPUT"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SITE_URL: ${{ vars.SITE_URL }}

  vps:
    needs: vps-image
    runs-on: ubuntu-24.04
    environment:
      name: vps
      url: ${{ vars.VPS_URL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: deploy
      - name: SSH key and known hosts
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$KNOWN" > ~/.ssh/known_hosts
        env:
          KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN: ${{ secrets.VPS_KNOWN_HOSTS }}
      - name: Pull and restart (docker compose on the VPS)
        run: |
          ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=yes -o BatchMode=yes "$USER_AT_HOST" \
            "cd ${DIR@Q} && SITE_IMAGE=${IMAGE@Q} docker compose pull site && SITE_IMAGE=${IMAGE@Q} docker compose up -d --no-build site"
        env:
          USER_AT_HOST: ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}
          DIR: ${{ vars.VPS_PATH || 'mrentro-site' }}
          IMAGE: ${{ needs.vps-image.outputs.image }}
      - name: Smoke test
        run: deploy/smoke-remote.sh "${URL%/}" "$GITHUB_SHA"
        env:
          URL: ${{ vars.VPS_URL }}

  sftp:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.DEPLOY_SFTP == 'true'
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: shared-hosting
      url: ${{ vars.SFTP_URL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: deploy
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: hosts
          path: out
      - name: SSH key and known hosts
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$KNOWN" > ~/.ssh/known_hosts
        env:
          KEY: ${{ secrets.SFTP_KEY }}
          KNOWN: ${{ secrets.SFTP_KNOWN_HOSTS }}
      - name: Upload (rsync over SSH, --delete only inside the target path)
        run: |
          case "$TARGET" in ""|"/"|"~"|"."|*..*) echo "SFTP_PATH must be a specific directory" >&2; exit 1 ;; esac
          rsync -rlz --delete --checksum \
            -e "ssh -i $HOME/.ssh/id_deploy -p ${PORT} -o StrictHostKeyChecking=yes -o BatchMode=yes" \
            out/apache/ "$USER_AT_HOST:$TARGET/"
        env:
          USER_AT_HOST: ${{ secrets.SFTP_USER }}@${{ secrets.SFTP_HOST }}
          TARGET: ${{ secrets.SFTP_PATH }}
          PORT: ${{ vars.SFTP_PORT || '22' }}
      - name: Smoke test
        run: deploy/smoke-remote.sh "${URL%/}" "$GITHUB_SHA"
        env:
          URL: ${{ vars.SFTP_URL }}
